<style>
  :root {
    --bg: #080B10; --bg-panel: #0D131A; --ink: #DCE6ED; --accent: #8FD6FF;
    --accent-soft: rgba(143,214,255,0.10); --line: #1F2B35; --muted: #64737D;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--bg); scroll-behavior: smooth; scroll-padding-top: 90px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  /* Floating stage nav */
  .stage-nav { position: fixed; left: 18px; top: 50%; transform: translateY(-50%); z-index: 35; display: flex; flex-direction: column; gap: 2px; max-height: 76vh; overflow-y: auto; padding: 10px 0; }
  .stage-nav a { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.04em; color: var(--muted); text-decoration: none; padding: 5px 10px 5px 14px; border-left: 2px solid var(--line); white-space: nowrap; max-width: 190px; overflow: hidden; text-overflow: clip; transition: color 0.2s ease, border-color 0.2s ease, padding-left 0.2s ease; }
  .stage-nav a:hover { color: var(--accent); border-left-color: var(--accent); padding-left: 18px; }
  .stage-nav a.on { color: var(--accent); border-left-color: var(--accent); }
  .stage-nav a.sub { padding-left: 24px; font-size: 10px; opacity: 0.85; }
  .stage-nav a.sub:hover { padding-left: 28px; }
  @media (max-width: 1240px) { .stage-nav { display: none; } }

  /* Global footer */
  footer#contact { border-top: 1px solid var(--line); margin-top: 20px; padding: 56px 0 64px; }
  footer#contact .footer-inner { display: flex; justify-content: space-between; align-items: flex-end; gap: 28px; flex-wrap: wrap; }
  .footer-cta { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px; color: var(--ink); letter-spacing: -0.01em; }
  .footer-sub { font-size: 15px; color: #AEBBC4; margin-top: 8px; max-width: 46ch; }
  .footer-links { display: flex; gap: 10px; flex-wrap: wrap; }
  .footer-links a { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: 0.05em; color: var(--accent); text-decoration: none; border: 1px solid var(--line); padding: 8px 12px; }
  .footer-links a:hover { border-color: var(--accent); background: var(--accent-soft); }
  @media (max-width: 400px) { .footer-cta { font-size: 23px; } footer#contact { padding: 40px 0 48px; } }
  body { background: var(--bg); color: var(--ink); font-family: 'Source Serif 4', serif; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .crt { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  .crt::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(180deg, rgba(143,214,255,0.035) 0px, rgba(143,214,255,0.035) 1px, transparent 1px, transparent 3px); }
  .crt::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 120%); }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .head { font-family: 'Space Grotesk', sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 32px; }

  nav { position: sticky; top: 0; z-index: 40; border-bottom: 1px solid var(--line); padding: 16px 0; background: rgba(8,11,16,0.82); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  nav .wrap { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: nowrap; }
  .nav-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.03em; color: var(--ink); text-decoration: none; }
  .nav-links { display: flex; gap: 22px; flex-shrink: 0; white-space: nowrap; font-size: 13px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); }
  .nav-links a { color: var(--muted); text-decoration: none; }
  .nav-links a:hover, .nav-links a.on { color: var(--accent); }
  @media (max-width: 400px) {
    nav { padding: 12px 0; }
    .nav-name { font-size: 14px; }
    .nav-links { gap: 13px; font-size: 11px; }
  }

  header.proj-hero { padding: 56px 0 40px; border-bottom: 1px solid var(--line); }
  .proj-index { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--accent); letter-spacing: 0.06em; margin-bottom: 18px; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 46px; letter-spacing: -0.01em; margin-bottom: 12px; }
  .proj-role { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--muted); margin-bottom: 28px; }

  .meta-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 18px 0; margin-bottom: 36px; }
  .meta-item .mono.label { font-size: 10.5px; color: var(--muted); letter-spacing: 0.06em; display: block; margin-bottom: 5px; }
  .meta-item .value { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14.5px; }

  .hero-visual, .img-block { border: 1px solid var(--line); background: var(--bg-panel); position: relative; overflow: hidden; }
  .hero-visual { aspect-ratio: 16/9; }
  .hero-visual img, .img-block img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-visual .corner { position: absolute; width: 18px; height: 18px; border: 1.5px solid var(--accent); opacity: 0.6; z-index: 2; }
  .corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  .hero-caption { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted); margin-top: 10px; }

  section.block { padding: 56px 0; border-bottom: 1px solid var(--line); }
  section.block:last-of-type { border-bottom: none; }
  .block-label { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent); letter-spacing: 0.06em; margin-bottom: 16px; }
  .block h2 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 27px; margin-bottom: 18px; max-width: 30ch; }
  .block h3 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px; margin: 28px 0 12px; }
  .block p { font-size: 16.5px; color: #C7D2D9; max-width: 68ch; margin-bottom: 16px; }
  .block ul { list-style: none; margin-bottom: 16px; }
  .block ul li { font-size: 16px; color: #AEBBC4; padding-left: 20px; position: relative; margin-bottom: 8px; max-width: 60ch; }
  .block ul li::before { content: "›"; position: absolute; left: 0; color: var(--accent); }

  .img-block.free { aspect-ratio: auto; }
  .img-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 28px 0; }

  .methodology { display: flex; align-items: center; flex-wrap: wrap; gap: 0; margin: 8px 0 30px; }
  .method-step { border: 1px solid var(--line); background: var(--bg-panel); padding: 10px 18px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--ink); white-space: nowrap; }
  .method-step.active { border-color: var(--accent); color: var(--accent); }
  .method-arrow { color: var(--accent); padding: 0 10px; font-family: 'IBM Plex Mono', monospace; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 8px; }
  .two-col h4 { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--accent); letter-spacing: 0.05em; margin-bottom: 8px; }
  .two-col p { font-size: 15px; margin-bottom: 0; }

  .hmw-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 20px 0; }
  .hmw-card { border: 1px solid var(--line); background: var(--accent-soft); padding: 14px 16px; font-size: 13px; color: #C7D2D9; }
  .hmw-card b { color: var(--accent); font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; display: block; margin-bottom: 6px; letter-spacing: 0.04em; }

  .stat-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 8px; }
  .stat { border: 1px solid var(--line); padding: 20px; }
  .stat .lbl-top { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--accent); letter-spacing: 0.05em; display: block; margin-bottom: 8px; }
  .stat p { font-size: 14.5px; color: #C7D2D9; margin: 0; }

  .closing-quote { padding: 60px 0 50px; text-align: center; border-top: 1px solid var(--line); }
  .closing-quote p { font-family: 'Space Grotesk', sans-serif; font-style: italic; font-weight: 500; font-size: 20px; color: var(--ink); max-width: 40ch; margin: 0 auto; line-height: 1.4; }

  .next-proj { padding: 56px 0 60px; display: flex; justify-content: space-between; align-items: center; }
  .next-proj a { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px; color: var(--ink); text-decoration: none; }
  .next-proj a:hover { color: var(--accent); }
  .next-proj .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted); display: block; margin-bottom: 6px; }
  .prev-proj { display: block; margin-top: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted); text-decoration: none; }
  .prev-proj:hover { color: var(--accent); }

  @media (max-width: 700px) {
    .wrap { padding: 0 20px; }
    h1 { font-size: 32px; }
    .meta-row { grid-template-columns: 1fr 1fr; row-gap: 16px; }
    .img-grid { grid-template-columns: 1fr; }
    .stat-row { grid-template-columns: 1fr; }
    .two-col { grid-template-columns: 1fr; gap: 14px; }
    .hmw-grid { grid-template-columns: 1fr; }
    .methodology { gap: 6px; }
    .method-arrow { display: none; }
  }

  /* Mobile hardening — smallest iOS & Android screens */
  body { -webkit-text-size-adjust: 100%; overflow-wrap: break-word; }
  img, svg, video { max-width: 100%; height: auto; }
  a, button { overflow-wrap: break-word; }
  @supports (padding: max(0px)) {
    .wrap { padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
    footer#contact { padding-bottom: max(48px, calc(env(safe-area-inset-bottom) + 32px)); }
  }
  @media (max-width: 340px) {
    .wrap { padding-left: 12px; padding-right: 12px; }
    h1 { font-size: 23px; }
    .nav-links { gap: 10px; font-size: 10px; }
    .nav-name { font-size: 12.5px; }
    .footer-cta { font-size: 20px; }
    .footer-links a { font-size: 10.5px; padding: 7px 9px; }
  }
</style>

<script>
function buildStageNav(){
  var old = document.querySelector('nav.stage-nav'); if (old) old.remove();
  var items = [];
  document.querySelectorAll('section.block').forEach(function(sec){
    function shorten(s){
      s = s.replace(/^\/\/\s*/, '').replace(/\s*↗\s*$/, '').trim();
      s = s.split(/\s+[—–]\s+/)[0];        // drop the clause after an em dash
      s = s.split(/\s+·\s+/)[0];           // drop the clause after a middot
      return s.trim();
    }
    var lab = sec.querySelector('.block-label');
    if (lab) items.push({ el: sec, text: shorten(lab.textContent), sub: false });
    sec.querySelectorAll('h3').forEach(function(h){ items.push({ el: h, text: shorten(h.textContent), sub: true }); });
  });
  if (items.length < 3) return;
  var nav = document.createElement('nav');
  nav.className = 'stage-nav';
  items.forEach(function(it, i){
    if (!it.el.id) it.el.id = 'sec-' + i;
    var a = document.createElement('a');
    a.href = '#' + it.el.id;
    a.textContent = it.text;
    if (it.sub) a.className = 'sub';
    nav.appendChild(a);
    it.link = a;
  });
  document.body.appendChild(nav);
  function sync(){
    var y = window.scrollY + 140, cur = items[0];
    items.forEach(function(it){ if (it.el.offsetTop <= y) cur = it; });
    items.forEach(function(it){ it.link.classList.toggle('on', it === cur); });
  }
  sync();
  window.addEventListener('scroll', sync, { passive: true });
}
buildStageNav();
document.addEventListener('nda:unlocked', buildStageNav);
</script>
