<style>
  :root {
    --bg: #080B10; --bg-panel: #0D131A; --ink: #DCE6ED; --accent: #8FD6FF;
    --accent-soft: rgba(143,214,255,0.10); --line: #1F2B35; --muted: #64737D;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--bg); scroll-behavior: smooth; scroll-padding-top: 90px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  /* Floating stage nav */
  .stage-nav { position: fixed; left: 18px; top: 50%; transform: translateY(-50%); z-index: 35; display: flex; flex-direction: column; gap: 2px; max-height: 76vh; overflow-y: auto; padding: 10px 0; }
  .stage-nav a { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.04em; color: var(--muted); text-decoration: none; padding: 5px 10px 5px 14px; border-left: 2px solid var(--line); white-space: nowrap; max-width: 190px; overflow: hidden; text-overflow: clip; transition: color 0.2s ease, border-color 0.2s ease, padding-left 0.2s ease; }
  .stage-nav a:hover { color: var(--accent); border-left-color: var(--accent); padding-left: 18px; }
  .stage-nav a.on { color: var(--accent); border-left-color: var(--accent); }
  .stage-nav a.sub { padding-left: 24px; font-size: 10px; opacity: 0.85; }
  .stage-nav a.sub:hover { padding-left: 28px; }
  @media (max-width: 1240px) { .stage-nav { display: none; } }

  /* Global footer */
  footer#contact { border-top: 1px solid var(--line); margin-top: 20px; padding: 56px 0 64px; }
  footer#contact .footer-inner { display: flex; justify-content: space-between; align-items: flex-end; gap: 28px; flex-wrap: wrap; }
  .footer-cta { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px; color: var(--ink); letter-spacing: -0.01em; }
  .footer-sub { font-size: 15px; color: #AEBBC4; margin-top: 8px; max-width: 46ch; }
  .footer-links { display: flex; gap: 10px; flex-wrap: wrap; }
  .footer-links a { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: 0.05em; color: var(--accent); text-decoration: none; border: 1px solid var(--line); padding: 8px 12px; }
  .footer-links a:hover { border-color: var(--accent); background: var(--accent-soft); }
  @media (max-width: 400px) { .footer-cta { font-size: 23px; } footer#contact { padding: 40px 0 48px; } }
  body { background: var(--bg); color: var(--ink); font-family: 'Source Serif 4', serif; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  img { max-width: 100%; }
  .crt { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  .crt::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(180deg, rgba(143,214,255,0.035) 0px, rgba(143,214,255,0.035) 1px, transparent 1px, transparent 3px); }
  .crt::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 120%); }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .head { font-family: 'Space Grotesk', sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 32px; }

  nav { position: sticky; top: 0; z-index: 40; border-bottom: 1px solid var(--line); padding: 16px 0; background: rgba(8,11,16,0.82); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  nav .wrap { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: nowrap; }
  .nav-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.03em; color: var(--ink); text-decoration: none; }
  .nav-links { display: flex; gap: 22px; flex-shrink: 0; white-space: nowrap; font-size: 13px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); }
  .nav-links a { color: var(--muted); text-decoration: none; }
  .nav-links a:hover, .nav-links a.on { color: var(--accent); }
  @media (max-width: 400px) {
    nav { padding: 12px 0; }
    .nav-name { font-size: 14px; }
    .nav-links { gap: 13px; font-size: 11px; }
  }

  header.proj-hero { padding: 56px 0 40px; border-bottom: 1px solid var(--line); }
  .proj-index { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--accent); letter-spacing: 0.06em; margin-bottom: 18px; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 46px; letter-spacing: -0.01em; margin-bottom: 12px; }
  .proj-role { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--muted); margin-bottom: 16px; }
  .site-link { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.06em; color: var(--accent); text-decoration: none; border: 1px solid var(--line); padding: 7px 12px; margin-bottom: 28px; }
  .site-link:hover { border-color: var(--accent); background: var(--accent-soft); }
  .block p a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(143,214,255,0.35); }
  .block p a:hover { border-bottom-color: var(--accent); }

  .meta-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 18px 0; margin-bottom: 36px; }
  .meta-item .mono.label { font-size: 10.5px; color: var(--muted); letter-spacing: 0.06em; display: block; margin-bottom: 5px; }
  .meta-item .value { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14.5px; }

  /* Hero device mockup — sized in container units so it scales as one image */
  .mock-stage { --mint: #05E7C3; container-type: inline-size; position: relative; aspect-ratio: 16/10; overflow: hidden; border: 1px solid var(--line); background: radial-gradient(ellipse 45% 55% at 12% 8%, rgba(120,100,255,0.55), transparent 70%), radial-gradient(ellipse 40% 50% at 92% 18%, rgba(5,231,195,0.28), transparent 70%), radial-gradient(ellipse 70% 40% at 50% 100%, rgba(40,60,90,0.45), transparent 70%), #05060A; }
  .mock-laptop { position: absolute; left: 5%; top: 12%; width: 68%; -webkit-box-reflect: below 1px linear-gradient(transparent 72%, rgba(255,255,255,0.10)); }
  .mock-lid { background: #0c0c0e; border: 1px solid #2c2d31; border-radius: 1.3cqw 1.3cqw 0 0; padding: 0.9cqw 0.9cqw 1.1cqw; }
  .mock-lid img { display: block; width: 100%; height: auto; border-radius: 0.3cqw; }
  .mock-base { height: 1.5cqw; margin: 0 -6%; background: linear-gradient(#d9dde2, #8b9098); border-radius: 0 0 1.4cqw 1.4cqw; }
  .mock-phone { position: absolute; right: 8%; top: 21%; width: 16.5%; background: #000; border: 0.35cqw solid #2b2c30; border-radius: 2.6cqw; padding: 0.6cqw; box-shadow: 0 2cqw 4cqw rgba(0,0,0,0.6); -webkit-box-reflect: below 1px linear-gradient(transparent 78%, rgba(255,255,255,0.10)); }
  .mock-phone img { display: block; width: 100%; height: auto; border-radius: 2cqw; }
  .glass { position: absolute; width: 17cqw; padding: 1cqw 1.3cqw; border-radius: 1.1cqw; background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0.05) 60%, rgba(255,255,255,0.12)); border: 1px solid rgba(255,255,255,0.28); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 1.5cqw 3cqw rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.35); z-index: 3; }
  .glass .g-title { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 1.35cqw; color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 0.6cqw; }
  .glass .g-dot { width: 1.1cqw; height: 1.1cqw; border-radius: 50%; background: var(--mint); box-shadow: 0 0 1cqw var(--mint); flex-shrink: 0; }
  .glass .g-sub { font-family: 'IBM Plex Mono', monospace; font-size: 0.9cqw; color: rgba(255,255,255,0.72); margin-top: 0.4cqw; line-height: 1.45; }
  .glass.g1 { left: 1.5%; top: 57%; }
  .glass.g2 { left: 10%; top: 79%; }
  .glass.g3 { right: 3%; top: 8%; }
  .glass.g4 { right: 1.5%; top: 60%; width: 18cqw; }
  .corner { position: absolute; width: 18px; height: 18px; border: 1.5px solid var(--accent); opacity: 0.6; z-index: 1; }
  .corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  .caption { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted); margin-top: 10px; }

  section.block { padding: 56px 0; border-bottom: 1px solid var(--line); }
  section.block:last-of-type { border-bottom: none; }
  .block-label { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent); letter-spacing: 0.06em; margin-bottom: 16px; }
  .block h2 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 27px; margin-bottom: 18px; max-width: 26ch; }
  .block h3 { font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0.06em; margin: 36px 0 12px; }
  .block p { font-size: 17px; color: #C7D2D9; max-width: 66ch; margin-bottom: 16px; }
  .block ul { list-style: none; margin-bottom: 16px; }
  .block ul li { font-size: 16px; color: #AEBBC4; padding-left: 20px; position: relative; margin-bottom: 8px; max-width: 60ch; }
  .block ul li::before { content: "›"; position: absolute; left: 0; color: var(--accent); }

  .timeline { border-left: 1px solid var(--line); margin: 24px 0 8px 6px; }
  .tl-item { position: relative; padding: 0 0 18px 24px; }
  .tl-item::before { content: ""; position: absolute; left: -4px; top: 8px; width: 7px; height: 7px; background: var(--accent); }
  .tl-date { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--accent); letter-spacing: 0.04em; }
  .tl-text { font-size: 15.5px; color: #C7D2D9; }

  .persona-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 24px 0; }
  .persona { border: 1px solid var(--line); background: var(--bg-panel); padding: 22px 20px; display: flex; flex-direction: column; }
  .persona-top { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .persona .p-avatar { width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; border: 1px solid rgba(143,214,255,0.5); background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; color: var(--accent); }
  .persona .p-name { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 17px; line-height: 1.2; }
  .persona .p-meta { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted); letter-spacing: 0.03em; margin-top: 3px; }
  .persona .p-tag { align-self: flex-start; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--accent); border: 1px solid var(--line); padding: 2px 8px; margin-bottom: 12px; }
  .persona .p-quote { font-style: italic; font-size: 14.5px; color: var(--ink); border-left: 2px solid var(--accent); padding-left: 10px; margin-bottom: 14px; }
  .persona .p-h { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted); letter-spacing: 0.06em; margin: 10px 0 6px; }
  .block .persona ul { margin-bottom: 4px; }
  .block .persona ul li { font-size: 13.5px; color: #AEBBC4; margin-bottom: 5px; padding-left: 14px; }
  .persona .p-help { font-size: 13.5px; color: #C7D2D9; margin: 0; }

  .figure { margin: 24px 0; }
  .figure .frame { border: 1px solid var(--line); background: var(--bg-panel); position: relative; }
  .figure .frame img { display: block; width: 100%; height: auto; }
  .figure.diagram .frame { padding: 16px; background: #7d7d7d; }
  .figure.diagram .frame img { width: auto; max-width: 100%; margin: 0 auto; image-rendering: auto; }

  .phone-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 24px 0; align-items: start; }
  .phone-grid.two { grid-template-columns: repeat(2, minmax(0, 240px)); }
  .phone { margin: 0; }
  .phone img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 10px; }
  .phone figcaption { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 8px; }

  .pair-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 24px 0; align-items: start; }
  .trio-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 24px 0; }
  .trio-grid .frame img { aspect-ratio: 4/5; object-fit: cover; }

  .img-block { border: 1px solid var(--line); background: var(--bg-panel); position: relative; overflow: hidden; margin: 24px 0; }
  .img-block.wide { aspect-ratio: 16/8; }
  .img-block .hatch { position: absolute; inset: 0; background-image: repeating-linear-gradient(45deg, rgba(143,214,255,0.04) 0, rgba(143,214,255,0.04) 1px, transparent 1px, transparent 10px), repeating-linear-gradient(-45deg, rgba(143,214,255,0.04) 0, rgba(143,214,255,0.04) 1px, transparent 1px, transparent 10px); }
  .img-block .ph-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); text-align: center; padding: 20px; }

  .other { background: var(--bg-panel); border-top: 1px solid var(--line); }
  .copy-list { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 16px; }
  .copy-chip { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; color: var(--ink); border: 1px solid var(--line); background: var(--bg); padding: 8px 14px; }

  .next-proj { padding: 56px 0 60px; display: flex; justify-content: space-between; align-items: center; }
  .next-proj a { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px; color: var(--ink); text-decoration: none; }
  .next-proj a:hover { color: var(--accent); }
  .next-proj .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted); display: block; margin-bottom: 6px; }
  .prev-proj { display: block; margin-top: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted); text-decoration: none; }
  .prev-proj:hover { color: var(--accent); }

  @media (max-width: 700px) {
    .wrap { padding: 0 20px; }
    h1 { font-size: 32px; }
    .meta-row { grid-template-columns: 1fr 1fr; row-gap: 16px; }
    .persona-top { flex-wrap: wrap; }
    .phone-grid { grid-template-columns: 1fr 1fr; }
    .persona-grid, .pair-grid, .trio-grid { grid-template-columns: 1fr; }
  }

  /* Site map */
  .sitemap { border: 1px solid var(--line); background: var(--bg-panel); padding: 26px 22px; margin: 24px 0; }
  .sm-root { display: inline-block; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; color: #06231d; background: var(--accent); padding: 7px 14px; border-radius: 4px; }
  .sm-branches { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-top: 22px; position: relative; }
  .sm-branch { border-top: 2px solid var(--accent); padding-top: 14px; }
  .sm-branch .sm-name { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; color: var(--ink); margin-bottom: 8px; }
  .sm-branch ul { list-style: none; margin: 0; }
  .sm-branch li { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted); padding: 3px 0 3px 12px; position: relative; line-height: 1.5; }
  .sm-branch li::before { content: "└"; position: absolute; left: 0; color: var(--line); }
  .sm-note { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted); margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }

  /* Interaction model */
  .flow-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin: 24px 0; }
  .flow-step { border: 1px solid var(--line); background: var(--bg-panel); padding: 16px 15px; position: relative; }
  .flow-step .fs-n { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--accent); letter-spacing: 0.08em; }
  .flow-step .fs-t { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14.5px; margin: 6px 0 6px; }
  .flow-step .fs-d { font-size: 12.5px; color: #AEBBC4; line-height: 1.5; }
  .flow-step .fs-screen { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: var(--muted); margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line); }

  /* Tasteful screen shelf */
  .shelf { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 22px; margin: 26px 0; }
  .shelf .device { background: #0a0a0c; border: 7px solid #17181c; border-radius: 26px; padding: 0; overflow: hidden; box-shadow: 0 14px 34px rgba(0,0,0,0.5); }
  .shelf .device img { display: block; width: 100%; height: auto; }
  .shelf figcaption { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted); margin-top: 10px; line-height: 1.55; }
  .shelf figcaption b { display: block; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13.5px; color: var(--ink); margin-bottom: 3px; letter-spacing: 0; }
  .shelf figure { margin: 0; }

  /* Currently-building empty state */
  .building { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px; background: radial-gradient(ellipse at center, rgba(143,214,255,0.07), transparent 70%); }
  .building svg { width: 34px; height: 34px; filter: drop-shadow(0 0 8px rgba(143,214,255,0.65)); animation: buildpulse 2.6s ease-in-out infinite; }
  .building .bt { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: var(--accent); text-shadow: 0 0 10px rgba(143,214,255,0.5); }
  .building .bs { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); max-width: 30ch; line-height: 1.5; }
  @keyframes buildpulse { 0%, 100% { opacity: 0.75; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }
  @media (prefers-reduced-motion: reduce) { .building svg { animation: none; } }

  /* Mobile hardening — smallest iOS & Android screens */
  body { -webkit-text-size-adjust: 100%; overflow-wrap: break-word; }
  img, svg, video { max-width: 100%; height: auto; }
  a, button { overflow-wrap: break-word; }
  @supports (padding: max(0px)) {
    .wrap { padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
    footer#contact { padding-bottom: max(48px, calc(env(safe-area-inset-bottom) + 32px)); }
  }
  @media (max-width: 340px) {
    .wrap { padding-left: 12px; padding-right: 12px; }
    h1 { font-size: 23px; }
    .nav-links { gap: 10px; font-size: 10px; }
    .nav-name { font-size: 12.5px; }
    .footer-cta { font-size: 20px; }
    .footer-links a { font-size: 10.5px; padding: 7px 9px; }
  }
</style>

<script>
function buildStageNav(){
  var old = document.querySelector('nav.stage-nav'); if (old) old.remove();
  var items = [];
  document.querySelectorAll('section.block').forEach(function(sec){
    function shorten(s){
      s = s.replace(/^\/\/\s*/, '').replace(/\s*↗\s*$/, '').trim();
      s = s.split(/\s+[—–]\s+/)[0];        // drop the clause after an em dash
      s = s.split(/\s+·\s+/)[0];           // drop the clause after a middot
      return s.trim();
    }
    var lab = sec.querySelector('.block-label');
    if (lab) items.push({ el: sec, text: shorten(lab.textContent), sub: false });
    sec.querySelectorAll('h3').forEach(function(h){ items.push({ el: h, text: shorten(h.textContent), sub: true }); });
  });
  if (items.length < 3) return;
  var nav = document.createElement('nav');
  nav.className = 'stage-nav';
  items.forEach(function(it, i){
    if (!it.el.id) it.el.id = 'sec-' + i;
    var a = document.createElement('a');
    a.href = '#' + it.el.id;
    a.textContent = it.text;
    if (it.sub) a.className = 'sub';
    nav.appendChild(a);
    it.link = a;
  });
  document.body.appendChild(nav);
  function sync(){
    var y = window.scrollY + 140, cur = items[0];
    items.forEach(function(it){ if (it.el.offsetTop <= y) cur = it; });
    items.forEach(function(it){ it.link.classList.toggle('on', it === cur); });
  }
  sync();
  window.addEventListener('scroll', sync, { passive: true });
}
buildStageNav();
document.addEventListener('nda:unlocked', buildStageNav);
</script>
