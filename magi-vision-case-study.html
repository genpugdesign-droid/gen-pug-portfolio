<style>
  :root {
    --bg: #080B10; --bg-panel: #0D131A; --ink: #DCE6ED; --accent: #8FD6FF;
    --accent-soft: rgba(143,214,255,0.10); --line: #1F2B35; --muted: #64737D;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--bg); scroll-behavior: smooth; scroll-padding-top: 90px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  /* Floating stage nav */
  .stage-nav { position: fixed; left: 18px; top: 50%; transform: translateY(-50%); z-index: 35; display: flex; flex-direction: column; gap: 2px; max-height: 76vh; overflow-y: auto; padding: 10px 0; }
  .stage-nav a { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.04em; color: var(--muted); text-decoration: none; padding: 5px 10px 5px 14px; border-left: 2px solid var(--line); white-space: nowrap; max-width: 190px; overflow: hidden; text-overflow: clip; transition: color 0.2s ease, border-color 0.2s ease, padding-left 0.2s ease; }
  .stage-nav a:hover { color: var(--accent); border-left-color: var(--accent); padding-left: 18px; }
  .stage-nav a.on { color: var(--accent); border-left-color: var(--accent); }
  .stage-nav a.sub { padding-left: 24px; font-size: 10px; opacity: 0.85; }
  .stage-nav a.sub:hover { padding-left: 28px; }
  @media (max-width: 1240px) { .stage-nav { display: none; } }

  /* Global footer */
  footer#contact { border-top: 1px solid var(--line); margin-top: 20px; padding: 56px 0 64px; }
  footer#contact .footer-inner { display: flex; justify-content: space-between; align-items: flex-end; gap: 28px; flex-wrap: wrap; }
  .footer-cta { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px; color: var(--ink); letter-spacing: -0.01em; }
  .footer-sub { font-size: 15px; color: #AEBBC4; margin-top: 8px; max-width: 46ch; }
  .footer-links { display: flex; gap: 10px; flex-wrap: wrap; }
  .footer-links a { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: 0.05em; color: var(--accent); text-decoration: none; border: 1px solid var(--line); padding: 8px 12px; }
  .footer-links a:hover { border-color: var(--accent); background: var(--accent-soft); }
  @media (max-width: 400px) { .footer-cta { font-size: 23px; } footer#contact { padding: 40px 0 48px; } }
  body { background: var(--bg); color: var(--ink); font-family: 'Source Serif 4', serif; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .crt { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  .crt::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(180deg, rgba(143,214,255,0.035) 0px, rgba(143,214,255,0.035) 1px, transparent 1px, transparent 3px); }
  .crt::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 120%); }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .head { font-family: 'Space Grotesk', sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 32px; }

  nav { position: sticky; top: 0; z-index: 40; border-bottom: 1px solid var(--line); padding: 16px 0; background: rgba(8,11,16,0.82); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  nav .wrap { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: nowrap; }
  .nav-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.03em; color: var(--ink); text-decoration: none; }
  .nav-links { display: flex; gap: 22px; flex-shrink: 0; white-space: nowrap; font-size: 13px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); }
  .nav-links a { color: var(--muted); text-decoration: none; }
  .nav-links a:hover, .nav-links a.on { color: var(--accent); }
  @media (max-width: 400px) {
    nav { padding: 12px 0; }
    .nav-name { font-size: 14px; }
    .nav-links { gap: 13px; font-size: 11px; }
  }

  header.proj-hero { padding: 56px 0 40px; border-bottom: 1px solid var(--line); }
  .proj-index { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--accent); letter-spacing: 0.06em; margin-bottom: 18px; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 46px; letter-spacing: -0.01em; margin-bottom: 12px; }
  .proj-role { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--muted); margin-bottom: 16px; }
  .site-link { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.06em; color: var(--accent); text-decoration: none; border: 1px solid var(--line); padding: 7px 12px; margin-bottom: 28px; }
  .site-link:hover { border-color: var(--accent); background: var(--accent-soft); }
  .block p a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(143,214,255,0.35); }
  .block p a:hover { border-bottom-color: var(--accent); }

  .meta-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 18px 0; margin-bottom: 36px; }
  .meta-item .mono.label { font-size: 10.5px; color: var(--muted); letter-spacing: 0.06em; display: block; margin-bottom: 5px; }
  .meta-item .value { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14.5px; }

  .hero-visual { border: 1px solid var(--line); background: var(--bg-panel); aspect-ratio: 16/9; position: relative; overflow: hidden; }
  .hero-visual video, .img-block video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-visual .hatch { position: absolute; inset: 0; background-image: repeating-linear-gradient(45deg, rgba(143,214,255,0.05) 0, rgba(143,214,255,0.05) 1px, transparent 1px, transparent 10px), repeating-linear-gradient(-45deg, rgba(143,214,255,0.05) 0, rgba(143,214,255,0.05) 1px, transparent 1px, transparent 10px); }
  .hero-visual .ph-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--muted); text-align: center; }
  .hero-visual .corner { position: absolute; width: 18px; height: 18px; border: 1.5px solid var(--accent); opacity: 0.6; }
  .corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  .hero-caption { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted); margin-top: 10px; }

  section.block { padding: 56px 0; border-bottom: 1px solid var(--line); }
  section.block:last-of-type { border-bottom: none; }
  .block-label { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent); letter-spacing: 0.06em; margin-bottom: 16px; }
  .block h2 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 27px; margin-bottom: 18px; max-width: 22ch; }
  .block p { font-size: 17px; color: #C7D2D9; max-width: 66ch; margin-bottom: 16px; }
  .block ul { list-style: none; margin-bottom: 16px; }
  .block ul li { font-size: 16px; color: #AEBBC4; padding-left: 20px; position: relative; margin-bottom: 8px; max-width: 60ch; }
  .block ul li::before { content: "›"; position: absolute; left: 0; color: var(--accent); }

  .img-block { border: 1px solid var(--line); background: var(--bg-panel); position: relative; overflow: hidden; margin: 28px 0; }
  .img-block.wide { aspect-ratio: 16/8; }
  .img-block.tall { aspect-ratio: 4/3; }
  .img-block .hatch { position: absolute; inset: 0; background-image: repeating-linear-gradient(45deg, rgba(143,214,255,0.04) 0, rgba(143,214,255,0.04) 1px, transparent 1px, transparent 10px), repeating-linear-gradient(-45deg, rgba(143,214,255,0.04) 0, rgba(143,214,255,0.04) 1px, transparent 1px, transparent 10px); }
  .img-block .ph-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); text-align: center; padding: 20px; }

  .img-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 28px 0; }

  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 8px; }
  .stat { border: 1px solid var(--line); padding: 20px; }
  .stat .num { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 28px; color: var(--accent); }
  .stat .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted); margin-top: 6px; }

  .swatch-row { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
  .swatch { width: 90px; }
  .swatch .chip { height: 56px; border: 1px solid var(--line); }
  .swatch .mono { font-size: 10.5px; color: var(--muted); margin-top: 6px; display: block; }

  .next-proj { padding: 56px 0 60px; display: flex; justify-content: space-between; align-items: center; }
  .next-proj a { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px; color: var(--ink); text-decoration: none; }
  .next-proj a:hover { color: var(--accent); }
  .next-proj .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted); display: block; margin-bottom: 6px; }
  .prev-proj { display: block; margin-top: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted); text-decoration: none; }
  .prev-proj:hover { color: var(--accent); }

  @media (max-width: 700px) {
    .wrap { padding: 0 20px; }
    h1 { font-size: 32px; }
    .meta-row { grid-template-columns: 1fr 1fr; row-gap: 16px; }
    .img-grid { grid-template-columns: 1fr; }
    .stat-row { grid-template-columns: 1fr; }
  }

  /* Desktop site mockup */
  .site-mock { margin: 28px 0 10px; }
  .browser { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #0c0c0e; box-shadow: 0 18px 40px rgba(0,0,0,0.5); }
  .browser-bar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: #15171b; border-bottom: 1px solid var(--line); }
  .browser-bar .dot { width: 9px; height: 9px; border-radius: 50%; background: #2c313a; flex-shrink: 0; }
  .browser-url { flex: 1; margin-left: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted); background: #0c0c0e; border: 1px solid var(--line); border-radius: 5px; padding: 4px 10px; white-space: nowrap; overflow: hidden; text-overflow: clip; }
  .browser img { display: block; width: 100%; height: auto; }
  @media (max-width: 480px) { .browser-bar { padding: 7px 9px; } .browser-url { font-size: 9px; } }

  /* Currently-building empty state */
  .building { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px; background: radial-gradient(ellipse at center, rgba(143,214,255,0.07), transparent 70%); }
  .building svg { width: 34px; height: 34px; filter: drop-shadow(0 0 8px rgba(143,214,255,0.65)); animation: buildpulse 2.6s ease-in-out infinite; }
  .building .bt { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: var(--accent); text-shadow: 0 0 10px rgba(143,214,255,0.5); }
  .building .bs { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); max-width: 30ch; line-height: 1.5; }
  @keyframes buildpulse { 0%, 100% { opacity: 0.75; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }
  @media (prefers-reduced-motion: reduce) { .building svg { animation: none; } }

  /* Mobile hardening — smallest iOS & Android screens */
  body { -webkit-text-size-adjust: 100%; overflow-wrap: break-word; }
  img, svg, video { max-width: 100%; height: auto; }
  a, button { overflow-wrap: break-word; }
  @supports (padding: max(0px)) {
    .wrap { padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
    footer#contact { padding-bottom: max(48px, calc(env(safe-area-inset-bottom) + 32px)); }
  }
  @media (max-width: 340px) {
    .wrap { padding-left: 12px; padding-right: 12px; }
    h1 { font-size: 23px; }
    .nav-links { gap: 10px; font-size: 10px; }
    .nav-name { font-size: 12.5px; }
    .footer-cta { font-size: 20px; }
    .footer-links a { font-size: 10.5px; padding: 7px 9px; }
  }
  /* ===== Magi brand booklet — flipbook ===== */
  .bk-intro { padding: 48px 0 8px; }
  .bk-intro h1 { margin-bottom: 10px; }
  .bk-intro .proj-role { margin-bottom: 18px; }
  .bk-intro p { font-size: 16.5px; color: #C7D2D9; max-width: 64ch; margin-bottom: 14px; }
  .bk-intro p a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(143,214,255,0.35); }
  .live { display: inline-flex; align-items: center; gap: 9px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: var(--accent); border: 1px solid var(--line); padding: 6px 11px; margin-top: 6px; }
  .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #FF2851; box-shadow: 0 0 0 0 rgba(255,40,81,0.6); animation: livepulse 1.8s ease-out infinite; }
  @keyframes livepulse { 0% { box-shadow: 0 0 0 0 rgba(255,40,81,0.55); } 80%, 100% { box-shadow: 0 0 0 9px rgba(255,40,81,0); } }

  .bk-wrap { max-width: 1180px; margin: 0 auto; padding: 26px 32px 10px; }
  .stage { position: relative; margin: 0 auto; perspective: 2600px; transition: height 0.35s ease; }
  .book { position: absolute; top: 0; left: 0; width: 1080px; height: 760px; transform-origin: 0 0; }
  .book-inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.7s cubic-bezier(.2,.7,.2,1); }
  .book.at-start .book-inner { transform: translateX(-270px); }
  .book.at-end .book-inner { transform: translateX(270px); }
  .book::after { content: ""; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 2px; margin-left: -1px; background: rgba(0,0,0,0.6); pointer-events: none; z-index: 2000; opacity: 1; transition: opacity 0.3s; }
  .book.at-start::after, .book.at-end::after { opacity: 0; }
  .leaf { position: absolute; top: 0; left: 50%; width: 540px; height: 760px; transform-origin: 0 50%; transform-style: preserve-3d; transition: transform 0.9s cubic-bezier(.45,.05,.25,1); cursor: pointer; }
  .leaf.flipped { transform: rotateY(-180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
  .face.back { transform: rotateY(180deg); }
  .face::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .face.front::after { background: linear-gradient(90deg, rgba(0,0,0,0.55) 0, rgba(0,0,0,0.12) 3.5%, transparent 9%); }
  .face.back::after { background: linear-gradient(270deg, rgba(0,0,0,0.55) 0, rgba(0,0,0,0.12) 3.5%, transparent 9%); }
  .leaf.moving .face::before { content: ""; position: absolute; inset: 0; z-index: 6; pointer-events: none; background: linear-gradient(90deg, rgba(0,0,0,0.0), rgba(0,0,0,0.35)); animation: flipshade 0.9s ease-in-out; opacity: 0; }
  @keyframes flipshade { 50% { opacity: 1; } }
  /* corner peel hint on the page you can turn */
  .face.front.turnable::before { content: ""; position: absolute; right: 0; bottom: 0; width: 0; height: 0; z-index: 7; background: linear-gradient(315deg, transparent 50%, #1b2a2d 50%, #2f4a4f 100%); box-shadow: -3px -3px 6px rgba(0,0,0,0.35); transition: width 0.25s ease, height 0.25s ease; }
  .leaf:hover .face.front.turnable::before { width: 34px; height: 34px; }
  .book .blank { background: #050607; }

  .bk-controls { display: flex; justify-content: center; align-items: center; gap: 18px; padding: 22px 0 6px; font-family: 'IBM Plex Mono', monospace; }
  .bk-controls button { font: inherit; font-size: 12px; letter-spacing: 0.08em; color: var(--accent); background: transparent; border: 1px solid var(--line); padding: 9px 14px; cursor: pointer; }
  .bk-controls button:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .bk-controls button:disabled { color: var(--muted); cursor: default; opacity: 0.5; }
  .bk-count { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; min-width: 12ch; text-align: center; }
  .bk-hint { text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted); letter-spacing: 0.06em; padding-bottom: 8px; }

  /* single-page mode (phones): pages reflow to the screen width */
  .stage.single { perspective: 1800px; overflow: hidden; transition: none; }
  .stage.single .book { position: relative; width: 100%; height: 100%; transform: none; }
  .stage.single .book::after { display: none; }
  .stage.single .book-inner { transform: none !important; }
  .stage.single .leaf { left: 0; width: 100%; height: auto; }
  .stage.single .face { position: relative; }
  .stage.single .face.back { position: absolute; inset: 0; }
  .stage.single .leaf.flipped { transform: rotateY(-100deg); opacity: 0; transition: transform 0.75s cubic-bezier(.45,.05,.25,1), opacity 0.75s ease; }
  .stage.single .face.front::after { background: linear-gradient(90deg, rgba(0,0,0,0.35) 0, transparent 4%); }

  @media (prefers-reduced-motion: reduce) {
    .leaf, .book-inner, .stage, .stage.single .leaf.flipped { transition: none !important; }
    .live::before { animation: none; }
  }
  @media (max-width: 700px) { .bk-wrap { padding: 18px 14px 6px; } .bk-intro { padding-top: 34px; } }

  /* ===== Pages — the Magi brand, scoped to the book ===== */
  .pg {
    --bg: #030304; --bg-alt: #08090a; --panel: #0a0b0c; --border: #1c2b2e; --border-strong: #2f4a4f;
    --blue: #00e5ff; --blue-dim: #007a8a; --red: #ff2851; --red-dim: #8a0021; --text: #c9f2ff; --text-dim: #5f7a80;
    --fb: 'Unbounded', 'Space Grotesk', system-ui, sans-serif; --fm: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    container-type: inline-size; container-name: pg;
    position: relative; width: 540px; height: 760px; padding: 30px 32px 52px; display: flex; flex-direction: column; gap: 15px;
    background: repeating-linear-gradient(to bottom, rgba(0,229,255,0.022) 0 1px, transparent 1px 3px), var(--bg);
    color: var(--text); font-family: var(--fb); font-weight: 300; font-size: 11.5px; line-height: 1.6; text-align: left; cursor: inherit;
  }
  .stage.single .pg { width: 100%; height: auto; min-height: 520px; }
  .pg * { box-sizing: border-box; }
  .pg p { margin: 0; color: var(--text-dim); }
  .pg p strong, .pg strong { font-weight: 600; color: var(--text); }
  .pg code { font-family: var(--fm); font-size: 0.92em; color: var(--blue); background: rgba(0,229,255,0.07); padding: 0 4px; }
  .pg a { color: var(--blue); text-decoration: none; }
  .pg .lead { font-size: 13.5px; font-weight: 400; color: var(--text); line-height: 1.5; }
  .pg .eyebrow { font-family: var(--fm); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--blue); }
  .pg h4 { margin: 0; font-size: 10.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .pg h4::before { content: ""; width: 6px; height: 6px; transform: rotate(45deg); background: var(--blue); flex: none; }
  .pg .blk { display: flex; flex-direction: column; gap: 9px; }

  .pg .hd { position: relative; display: flex; align-items: center; gap: 11px; padding: 9px 11px; border: 1px solid var(--border-strong); background: linear-gradient(90deg, rgba(0,229,255,0.07), transparent 62%), var(--panel); }
  .pg .hd::after { content: ""; position: absolute; left: 11px; bottom: -1px; width: 34px; height: 2px; background: var(--blue); }
  .pg .hd.red { background: linear-gradient(90deg, rgba(255,40,81,0.07), transparent 62%), var(--panel); }
  .pg .hd.red::after { background: var(--red); }
  .pg .hd .ix { font-family: var(--fm); font-size: 9.5px; letter-spacing: 0.12em; color: var(--text-dim); border: 1px solid var(--border-strong); padding: 1px 6px; }
  .pg .hd b { font-size: 11.5px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; }
  .pg .hd .rl { flex: 1; height: 1px; background: repeating-linear-gradient(90deg, var(--border-strong) 0 6px, transparent 6px 13px); }
  .pg .hd .mk { display: flex; gap: 5px; }
  .pg .hd .mk i { width: 6px; height: 6px; transform: rotate(45deg); background: var(--border-strong); }
  .pg .hd .mk i:nth-child(2) { background: var(--red); }
  .pg .hd .mk i:nth-child(3) { background: var(--blue); }

  .pg .ft { position: absolute; left: 32px; right: 32px; bottom: 20px; display: flex; justify-content: space-between; font-family: var(--fm); font-size: 9px; letter-spacing: 0.14em; color: var(--text-dim); text-transform: uppercase; border-top: 1px solid var(--border); padding-top: 8px; }
  .stage.single .pg .ft { position: static; margin-top: auto; }

  /* notched card: outer plate is the border colour, inner plate is inset 1px with the same notch */
  .pg .card { position: relative; isolation: isolate; background: var(--border-strong); padding: 13px 14px; display: flex; flex-direction: column; gap: 6px; clip-path: polygon(10px 0, calc(100% - 10px) 0, calc(100% - 10px) 10px, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 10px calc(100% - 10px), 0 calc(100% - 10px), 0 10px, 10px 10px); }
  .pg .card::before { content: ""; position: absolute; inset: 1px; z-index: -1; background: var(--panel); clip-path: polygon(10px 0, calc(100% - 10px) 0, calc(100% - 10px) 10px, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 10px calc(100% - 10px), 0 calc(100% - 10px), 0 10px, 10px 10px); }
  .pg .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pg .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pg .g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

  .pg ul.tk { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .pg ul.tk li { position: relative; padding-left: 16px; color: var(--text-dim); }
  .pg ul.tk li::before { content: ""; position: absolute; left: 1px; top: 0.66em; width: 5px; height: 5px; transform: rotate(45deg); border: 1px solid var(--blue); }
  .pg ul.tk.red li::before { border-color: var(--red); }

  .pg table { width: 100%; border-collapse: collapse; font-size: 10.5px; border: 1px solid var(--border); }
  .pg th { text-align: left; font-weight: 600; font-size: 8.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-dim); background: var(--bg-alt); }
  .pg th, .pg td { padding: 6px 9px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .pg td { color: var(--text-dim); }
  .pg td:first-child { color: var(--text); font-weight: 400; }
  .pg td.num { font-family: var(--fm); white-space: nowrap; }

  .pg .dd { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); }
  .pg .dd > div { padding: 11px 13px; display: flex; flex-direction: column; gap: 6px; }
  .pg .dd > div + div { border-left: 1px solid var(--border); }
  .pg .dd .tg { font-family: var(--fm); font-size: 9.5px; letter-spacing: 0.16em; color: var(--blue); }
  .pg .dd .no .tg { color: var(--red); }
  .pg .dd p { color: var(--text); font-size: 11px; }
  .pg .dd .no p { color: var(--text-dim); text-decoration: line-through; text-decoration-color: var(--red-dim); }

  .pg .lines { display: grid; gap: 1px; background: var(--border); border: 1px solid var(--border); }
  .pg .line { background: var(--panel); padding: 9px 12px; display: flex; justify-content: space-between; gap: 14px; align-items: baseline; }
  .pg .line q { quotes: none; font-size: 11.5px; font-weight: 500; color: var(--text); }
  .pg .line span { font-family: var(--fm); font-size: 8.5px; letter-spacing: 0.14em; color: var(--text-dim); text-transform: uppercase; white-space: nowrap; }

  .pg .plate { display: flex; flex-direction: column; gap: 6px; }
  .pg .plate .art { display: grid; place-items: center; aspect-ratio: 16 / 9; padding: 14px; border: 1px solid var(--border); background: var(--bg); }
  .pg .plate .art.light { background: #f4f6f7; border-color: #f4f6f7; }
  .pg .plate .art.sq { aspect-ratio: 1; }
  .pg .plate .art img { max-height: 100%; max-width: 88%; display: block; }
  .pg .cap { display: flex; justify-content: space-between; gap: 8px; font-size: 9.5px; }
  .pg .cap b { font-weight: 500; color: var(--text); }
  .pg .cap span { font-family: var(--fm); font-size: 8.5px; color: var(--text-dim); }

  .pg .sw { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .pg .sw.five { grid-template-columns: repeat(5, 1fr); }
  .pg .swc { border: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; }
  .pg .swc i { display: block; height: 34px; border-bottom: 1px solid var(--border); }
  .pg .swc span { padding: 5px 6px; font-family: var(--fm); font-size: 8.5px; line-height: 1.35; color: var(--text-dim); }
  .pg .swc span b { display: block; font-family: var(--fb); font-size: 9px; font-weight: 500; color: var(--text); }
  .pg .ratio { display: grid; grid-template-columns: 6fr 2fr 1fr 1fr; height: 22px; border: 1px solid var(--border); }
  .pg .ratio div { display: flex; align-items: center; padding: 0 7px; font-family: var(--fm); font-size: 8.5px; letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; }

  .pg .big { font-size: 46px; line-height: 1; font-weight: 800; letter-spacing: -0.01em; color: var(--text); }
  .pg .alpha { font-size: 15px; color: var(--text); letter-spacing: 0.04em; word-break: break-all; line-height: 1.45; }
  .pg .weights { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .pg .weights span { font-size: 18px; color: var(--text); }
  .pg .weights small { display: block; font-family: var(--fm); font-size: 8.5px; color: var(--text-dim); letter-spacing: 0.1em; }
  .pg .scale { display: flex; flex-direction: column; border: 1px solid var(--border); }
  .pg .scale > div { display: grid; grid-template-columns: 112px 1fr; gap: 12px; align-items: baseline; padding: 8px 11px; border-bottom: 1px solid var(--border); }
  .pg .scale > div:last-child { border-bottom: 0; }
  .pg .scale .k { font-family: var(--fm); font-size: 8.5px; color: var(--text-dim); line-height: 1.45; }
  .pg .scale .s { color: var(--text); min-width: 0; }

  .pg .demo { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .pg .ring { width: 74px; height: 74px; border-radius: 50%; border: 1px solid var(--border-strong); display: grid; place-content: center; justify-items: center; color: var(--blue); font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; line-height: 1.35; text-align: center; transition: background .25s, color .25s; }
  .pg .ring:hover { background: var(--blue); color: #030304; }
  .pg .pill { border: 1px solid var(--border-strong); border-radius: 999px; padding: 5px 11px; font-family: var(--fm); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--blue); }
  .pg .bracket { font-family: var(--fm); font-size: 10.5px; color: var(--text); letter-spacing: 0.06em; }
  .pg .cursor { color: var(--red); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pg .mdia { display: flex; gap: 11px; align-items: center; }
  .pg .mdia i { width: 11px; height: 11px; border: 1px solid var(--blue); transform: rotate(45deg); }
  .pg .mdia i.s { background: var(--blue); border-color: transparent; }
  .pg .mdia i.f { opacity: 0.35; }

  .pg .states { display: flex; flex-wrap: wrap; gap: 6px; }
  .pg .badge { font-weight: 700; font-size: 10.5px; letter-spacing: 0.12em; padding: 6px 9px; }
  .pg .pulse { font-family: var(--fm); font-size: 9px; letter-spacing: 0.12em; border: 1px dashed var(--text-dim); color: var(--text-dim); padding: 6px 9px; }

  .pg figure { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .pg figure img, .pg figure video { width: 100%; height: auto; display: block; border: 1px solid var(--border); background: var(--bg-alt); }
  .pg figcaption { font-size: 9.5px; color: var(--text-dim); line-height: 1.5; }
  .pg figcaption b { color: var(--text); font-weight: 500; }
  .pg .tall img, .pg .tall video { aspect-ratio: 4 / 5; object-fit: cover; }
  .pg dl.specs { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 0; font-size: 10.5px; }
  .pg dl.specs dt { font-family: var(--fm); font-size: 8.5px; letter-spacing: 0.14em; color: var(--text-dim); text-transform: uppercase; padding-top: 2px; }
  .pg dl.specs dd { margin: 0; color: var(--text); }
  .pg .price { font-size: 24px; font-weight: 700; letter-spacing: 0.02em; }
  .pg .chip { font-family: var(--fm); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid var(--border-strong); border-radius: 999px; padding: 3px 9px; color: var(--text-dim); }
  .pg .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .pg .chip b { color: var(--text); font-weight: 600; }
  .pg .soon { display: grid; place-items: center; aspect-ratio: 4 / 3; border: 1px dashed var(--border-strong); font-family: var(--fm); font-size: 8.5px; letter-spacing: 0.14em; color: var(--text-dim); text-align: center; padding: 8px; line-height: 1.6; }

  .pg .toc { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
  .pg .toc a { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: baseline; padding: 8px 2px; border-bottom: 1px solid var(--border); color: var(--text); font-size: 12px; letter-spacing: 0.06em; transition: color .2s, padding-left .2s; }
  .pg .toc a:hover { color: var(--blue); padding-left: 6px; }
  .pg .toc a span { font-family: var(--fm); font-size: 9.5px; color: var(--text-dim); letter-spacing: 0.1em; }
  .pg .stamp { display: inline-flex; align-items: center; gap: 8px; font-family: var(--fm); font-size: 9.5px; letter-spacing: 0.12em; color: var(--blue); border: 1px solid var(--border-strong); padding: 5px 9px; align-self: flex-start; }
  .pg .stamp::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--red); }

  .pg .log { display: flex; flex-direction: column; border: 1px solid var(--border); }
  .pg .log div { display: grid; grid-template-columns: 76px 1fr; gap: 12px; padding: 9px 11px; border-bottom: 1px solid var(--border); }
  .pg .log div:last-child { border-bottom: 0; }
  .pg .log time { font-family: var(--fm); font-size: 9.5px; color: var(--blue); }
  .pg .log span { color: var(--text-dim); }
  .pg .log div:first-child span { color: var(--text); }

  /* covers */
  .pg.cover { justify-content: space-between; padding: 44px 40px 40px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 42%, rgba(0,229,255,0.10), transparent 62%), repeating-linear-gradient(to bottom, rgba(0,229,255,0.035) 0 1px, transparent 1px 3px), #030304; }
  .pg.cover .mark { width: 100%; height: auto; display: block; filter: drop-shadow(0 0 30px rgba(0,229,255,0.18)); }
  .pg.cover h2 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.1; }
  .pg.cover h2 em { font-style: normal; color: var(--blue); text-shadow: 0 0 18px rgba(0,229,255,0.35); }
  .pg.cover .forged { display: flex; align-items: center; gap: 12px; font-size: 9.5px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-dim); }
  .pg.cover .forged img { width: 38px; }
  .pg .dia { position: absolute; width: var(--s); height: var(--s); left: var(--x); top: var(--y); border: 1px solid var(--blue); opacity: var(--o); transform: rotate(45deg); animation: bkdrift var(--d) ease-in-out infinite alternate; }
  .pg .dia.solid { background: var(--blue); border-color: transparent; }
  @keyframes bkdrift { to { transform: translate(var(--dx), -30px) rotate(225deg); } }
  .pg.back-cover { justify-content: center; align-items: center; text-align: center; gap: 22px; }
  .pg.back-cover img.pent { width: 120px; filter: drop-shadow(0 0 24px rgba(0,229,255,0.25)); }

  @container pg (max-width: 470px) {
    .g2, .g3, .dd { grid-template-columns: 1fr !important; }
    .dd > div + div { border-left: 0 !important; border-top: 1px solid var(--border); }
    .g4 { grid-template-columns: 1fr 1fr !important; }
    .sw, .sw.five { grid-template-columns: repeat(3, 1fr) !important; }
    .scale > div { grid-template-columns: 1fr !important; gap: 2px !important; }
    .big { font-size: 36px !important; }
    .line { flex-direction: column; gap: 3px !important; }
  }
  @media (prefers-reduced-motion: reduce) { .pg .dia, .pg .cursor { animation: none; } }
  .booklet-sec { border-bottom: 1px solid var(--line); padding-bottom: 40px; }
  .bk-lede { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }

<script>
function buildBooklet() {
  if (!document.querySelector('.bk-pages') || window.bookletBuilt) return;
  window.bookletBuilt = true;
  var W = 540, H = 760;                       // artboard size of one page
  var src = document.querySelector('.bk-pages');
  var stage = document.getElementById('bkStage');
  var prevBtn = document.getElementById('bkPrev'), nextBtn = document.getElementById('bkNext'), countEl = document.getElementById('bkCount');
  var pages = Array.prototype.slice.call(src.querySelectorAll('.pg'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- living-document data: changelog drives the stamps and the log page ----
  var log = { version: 'v1', entries: [] };
  try { log = JSON.parse(document.getElementById('bk-log').textContent); } catch (e) {}
  var latest = log.entries.length ? log.entries[0].date : '';
  document.querySelectorAll('[data-bk-updated]').forEach(function (el) { el.textContent = latest; });
  document.querySelectorAll('[data-bk-version]').forEach(function (el) { el.textContent = log.version; });
  document.querySelectorAll('[data-bk-count]').forEach(function (el) { el.textContent = log.entries.length; });
  document.querySelectorAll('[data-bk-log]').forEach(function (box) {
    log.entries.forEach(function (e) {
      var row = document.createElement('div');
      var t = document.createElement('time'); t.textContent = e.date;
      var s = document.createElement('span'); s.textContent = e.text;
      row.appendChild(t); row.appendChild(s); box.appendChild(row);
    });
  });
  var pubDate = document.getElementById('bkUpdated'); if (pubDate) pubDate.textContent = latest;

  // ---- running feet + contents page numbers ----
  var titleIndex = {};
  pages.forEach(function (pg, i) {
    var t = pg.getAttribute('data-title');
    if (!(t in titleIndex)) titleIndex[t] = i;
    if (!pg.classList.contains('cover') && !pg.querySelector('.ft')) {
      var ft = document.createElement('div'); ft.className = 'ft';
      ft.innerHTML = '<span>magi · brand booklet</span><span>' + String(i + 1).padStart(2, '0') + '</span>';
      pg.appendChild(ft);
    }
  });
  document.querySelectorAll('[data-pg]').forEach(function (el) {
    var i = titleIndex[el.getAttribute('data-pg')]; if (i != null) el.textContent = String(i + 1).padStart(2, '0');
  });

  var mode = null, leaves = [], cur = 0, book, inner;

  function blankFace() { var b = document.createElement('div'); b.className = 'pg blank'; return b; }

  function build() {
    var single = window.matchMedia('(max-width: 760px)').matches;
    var newMode = single ? 'single' : 'spread';
    var keepPage = mode ? currentPage() : 0;
    // move pages back to the source before rebuilding
    pages.forEach(function (p) { src.appendChild(p); });
    stage.innerHTML = '';
    stage.classList.toggle('single', single);
    mode = newMode; leaves = []; if (ro && watched) { ro.unobserve(watched); watched = null; }
    book = document.createElement('div'); book.className = 'book';
    inner = document.createElement('div'); inner.className = 'book-inner';
    book.appendChild(inner); stage.appendChild(book);
    var step = mode === 'spread' ? 2 : 1;
    for (var i = 0; i < pages.length; i += step) {
      var leaf = document.createElement('div'); leaf.className = 'leaf';
      var f = document.createElement('div'); f.className = 'face front';
      var b = document.createElement('div'); b.className = 'face back';
      f.appendChild(pages[i]);
      b.appendChild(mode === 'spread' && pages[i + 1] ? pages[i + 1] : blankFace());
      leaf.appendChild(f); leaf.appendChild(b); inner.appendChild(leaf);
      leaves.push(leaf);
    }
    cur = pageToCur(keepPage);
    layout(true);
    fit();
  }

  function pageToCur(p) { return mode === 'spread' ? Math.ceil(p / 2) : p; }
  function currentPage() { return mode === 'spread' ? Math.max(0, cur * 2 - 1) : cur; }
  function maxCur() { return mode === 'spread' ? leaves.length : leaves.length - 1; }

  function layout(instant) {
    leaves.forEach(function (leaf, i) {
      var flipped = i < cur;
      if (instant) leaf.style.transition = 'none';
      leaf.classList.toggle('flipped', flipped);
      leaf.style.zIndex = flipped ? i + 1 : leaves.length - i + 1;
      leaf.querySelector('.face.front').classList.toggle('turnable', i === cur && mode === 'spread');
      leaf.style.visibility = mode === 'single' && i !== cur ? 'hidden' : '';
      if (instant) { leaf.offsetWidth; leaf.style.transition = ''; }
    });
    if (mode === 'spread') {
      book.classList.toggle('at-start', cur === 0);
      book.classList.toggle('at-end', cur === leaves.length);
    } else {
      sizeSingle();
    }
    prevBtn.disabled = cur === 0;
    nextBtn.disabled = cur === maxCur();
    var n = pages.length, label;
    if (mode === 'spread') {
      var l = cur * 2, r = cur * 2 + 1;              // 1-based page numbers on show
      label = cur === 0 ? '01' : cur === leaves.length ? String(n).padStart(2, '0') : String(l).padStart(2, '0') + '–' + String(Math.min(r, n)).padStart(2, '0');
    } else { label = String(cur + 1).padStart(2, '0'); }
    countEl.textContent = 'PAGE ' + label + ' / ' + n;
    media();
  }

  function go(to) {
    to = Math.max(0, Math.min(maxCur(), to));
    if (to === cur) return;
    var dir = to > cur ? 1 : -1, steps = Math.abs(to - cur);
    if (mode === 'single') leaves.forEach(function (l, i) { if (i >= Math.min(cur, to) && i <= Math.max(cur, to)) l.style.visibility = ''; });
    var gap = reduce ? 0 : Math.min(140, 520 / steps);
    (function stepOnce(k) {
      var i = dir > 0 ? cur : cur - 1;
      var leaf = leaves[i];
      leaf.style.zIndex = 1000 + k;
      leaf.classList.add('moving');
      setTimeout(function () { leaf.classList.remove('moving'); }, 950);
      cur += dir;
      leaf.classList.toggle('flipped', dir > 0);
      if (k + 1 < steps) setTimeout(function () { stepOnce(k + 1); }, gap);
      else setTimeout(function () { layout(false); }, reduce ? 0 : 900);
      if (mode === 'spread') { book.classList.toggle('at-start', cur === 0); book.classList.toggle('at-end', cur === leaves.length); }
      else sizeSingle();
    })(0);
    prevBtn.disabled = to === 0; nextBtn.disabled = to === maxCur();
  }

  // in single mode the stage follows the open page's height, including late font/image loads
  var ro = 'ResizeObserver' in window ? new ResizeObserver(function () { if (mode === 'single') sizeSingle(); }) : null;
  var watched = null;
  function sizeSingle() {
    var face = leaves[Math.min(cur, leaves.length - 1)].querySelector('.face.front');
    if (ro && watched !== face) { if (watched) ro.unobserve(watched); ro.observe(face); watched = face; }
    stage.style.height = face.offsetHeight + 'px';
  }

  function fit() {
    if (mode === 'single') { stage.style.width = '100%'; book.style.transform = ''; sizeSingle(); return; }
    var avail = stage.parentElement.clientWidth;
    var s = Math.min(1, avail / (W * 2));
    stage.style.width = (W * 2 * s) + 'px';
    stage.style.height = (H * s) + 'px';
    book.style.transform = 'scale(' + s + ')';
  }

  // play only the videos on the open spread / page
  function media() {
    var showing = [];
    if (mode === 'spread') { showing = [cur * 2 - 1, cur * 2]; } else { showing = [cur]; }
    pages.forEach(function (pg, i) {
      pg.querySelectorAll('video').forEach(function (v) {
        if (showing.indexOf(i) !== -1) {
          if (!v.src && window.ndaMedia && v.dataset.ndaLazy) { if (!reduce) v.dataset.ndaPlay = '1'; window.ndaMedia(v); }
          if (!v.src && v.dataset.src) v.src = v.dataset.src;
          if (!reduce) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
        } else if (!v.paused) v.pause();
      });
    });
  }

  // ---- input ----
  prevBtn.addEventListener('click', function () { go(cur - 1); });
  nextBtn.addEventListener('click', function () { go(cur + 1); });
  stage.addEventListener('click', function (e) {
    var a = e.target.closest('a');
    if (a && a.dataset.goto) { e.preventDefault(); var p = titleIndex[a.dataset.goto]; if (p != null) go(pageToCur(p)); return; }
    if (a || e.target.closest('video')) return;
    var face = e.target.closest('.face'); if (!face) return;
    if (mode === 'single') { go(cur + 1); return; }
    go(face.classList.contains('back') ? cur - 1 : cur + 1);
  });
  document.addEventListener('keydown', function (e) {
    if (e.target.closest && e.target.closest('input, textarea, select')) return;
    var r = stage.getBoundingClientRect();
    if (r.bottom < 0 || r.top > window.innerHeight) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
    if (e.key === 'Home') go(0);
    if (e.key === 'End') go(maxCur());
  });
  var tx = null, ty = null;
  stage.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    if (tx == null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.3) go(cur + (dx < 0 ? 1 : -1));
  }, { passive: true });

  var lastSingle = null, rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      var single = window.matchMedia('(max-width: 760px)').matches;
      if (single !== lastSingle) { lastSingle = single; build(); } else fit();
    }, 120);
  });
  lastSingle = window.matchMedia('(max-width: 760px)').matches;
  build();
  // fonts and images change page heights in single mode
  window.addEventListener('load', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  // deep link: magi-brand-booklet.html#p=12
  var m = location.hash.match(/p=(\d+)/); if (m) { cur = pageToCur(Math.max(0, +m[1] - 1)); if (cur > maxCur()) cur = maxCur(); layout(true); }
}
buildBooklet();
document.addEventListener('nda:unlocked', buildBooklet);
</script>

<script>
function buildStageNav(){
  var old = document.querySelector('nav.stage-nav'); if (old) old.remove();
  var items = [];
  document.querySelectorAll('section.block').forEach(function(sec){
    function shorten(s){
      s = s.replace(/^\/\/\s*/, '').replace(/\s*↗\s*$/, '').trim();
      s = s.split(/\s+[—–]\s+/)[0];        // drop the clause after an em dash
      s = s.split(/\s+·\s+/)[0];           // drop the clause after a middot
      return s.trim();
    }
    var lab = sec.querySelector('.block-label');
    if (lab) items.push({ el: sec, text: shorten(lab.textContent), sub: false });
    sec.querySelectorAll('h3').forEach(function(h){ items.push({ el: h, text: shorten(h.textContent), sub: true }); });
  });
  if (items.length < 3) return;
  var nav = document.createElement('nav');
  nav.className = 'stage-nav';
  items.forEach(function(it, i){
    if (!it.el.id) it.el.id = 'sec-' + i;
    var a = document.createElement('a');
    a.href = '#' + it.el.id;
    a.textContent = it.text;
    if (it.sub) a.className = 'sub';
    nav.appendChild(a);
    it.link = a;
  });
  document.body.appendChild(nav);
  function sync(){
    var y = window.scrollY + 140, cur = items[0];
    items.forEach(function(it){ if (it.el.offsetTop <= y) cur = it; });
    items.forEach(function(it){ it.link.classList.toggle('on', it === cur); });
  }
  sync();
  window.addEventListener('scroll', sync, { passive: true });
}
buildStageNav();
document.addEventListener('nda:unlocked', buildStageNav);
</script>

</body>
</html>
